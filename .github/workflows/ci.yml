# PR·push 시 견적 공식 검증 + 빌드
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: 견적 공식 검증 (견적서·칼선 실측 대조)
        run: npm run verify
      - name: 빌드
        run: npm run build
